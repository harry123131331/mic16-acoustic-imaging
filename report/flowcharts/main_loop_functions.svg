<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1375" viewBox="0 0 1650 1375">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#374151"/></marker></defs>
<rect x="57.7" y="165.0" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="416.6" y="218.8" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">main()初始化 → 平台ready</text>
<text x="416.6" y="260.8" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">先待机，不自动采集</text>
<rect x="57.7" y="393.8" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="416.6" y="447.6" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">m16_network_poll()</text>
<text x="416.6" y="489.6" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">m16_control_udp_step()</text>
<rect x="57.7" y="622.6" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="416.6" y="676.4" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">m16_audio_platform_arm_step()</text>
<text x="416.6" y="718.4" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">进入常驻step</text>
<rect x="57.7" y="851.4" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="416.6" y="905.2" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">m16_pcm_acquisition_step()</text>
<text x="416.6" y="947.2" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">先推进采集与DMA归还</text>
<rect x="57.7" y="1080.2" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="416.6" y="1134.0" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">take_action() / backend()</text>
<text x="416.6" y="1176.0" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">START、STOP；共享设备服务</text>
<path d="M416.6 319.0 L416.6 385.0" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M416.6 547.8 L416.6 613.8" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M416.6 776.6 L416.6 842.6" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M416.6 1005.4 L416.6 1071.4" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="899.2" y="165.0" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="1258.1" y="218.8" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">RUNNING时 raw_copy()</text>
<text x="1258.1" y="260.8" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">按256个F32分块复制到发送槽</text>
<rect x="899.2" y="393.8" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="1258.1" y="447.6" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">send_one()</text>
<text x="1258.1" y="489.6" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">结果优先；一次尝试一个UDP包</text>
<rect x="899.2" y="622.6" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="1258.1" y="676.4" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">m16_latest_window_step()</text>
<text x="1258.1" y="718.4" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">选窗、快照、计算、等待结果取走</text>
<rect x="899.2" y="851.4" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="1258.1" y="905.2" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">若STOP / FAULT，改走drain()</text>
<text x="1258.1" y="947.2" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">终止新分析，归还设备，排空RAW</text>
<rect x="899.2" y="1080.2" width="717.7" height="149.6" rx="10" fill="white" stroke="#4b5563" stroke-width="3"/>
<text x="1258.1" y="1134.0" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">m16_control_update()</text>
<text x="1258.1" y="1176.0" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="37" fill="#202830">状态、busy位、计算时间；回主循环</text>
<path d="M1258.1 319.0 L1258.1 385.0" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1258.1 547.8 L1258.1 613.8" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1258.1 776.6 L1258.1 842.6" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1258.1 1005.4 L1258.1 1071.4" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M775.5 1155.0 L899.2 239.8" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="825.0" y="1337.6" text-anchor="middle" dominant-baseline="central" font-family="SimSun" font-size="32" fill="#202830">右列前三项仅在RUNNING执行；STOP/FAULT跳过它们，走drain后更新状态。</text>
</svg>